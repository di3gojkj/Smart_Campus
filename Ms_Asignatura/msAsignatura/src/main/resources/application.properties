spring.application.name=msAsignatura

server.port= 8070

#Ubicacion de la BD a la que nos conectaremos
spring.datasource.url=jdbc:mysql://localhost:3306/db_Asignatura?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACION DE HIBERNATE / JPA
# update: crea las tablas si no existen, y si existen solo las actualiza sin borrar tus datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# CONFIGURACION DE LOGS
logging.level.com.smartcampus.msAsignatura=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate.orm.jdbc.bind=DEBUG 
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

#Conexion con semestre

ms.estado.url=http://localhost:8080
