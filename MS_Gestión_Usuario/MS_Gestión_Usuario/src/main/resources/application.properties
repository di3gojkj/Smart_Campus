spring.application.name=MS_Gestion_Usuario
server.port=8084

# Configuración de Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_usuario?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# URL del Microservicio de Estados (Puerto 8083)
ms.estado.url=http://localhost:8083

# Configuración Avanzada de Logs (SLF4J / Logback)
logging.level.com.diego.MS_Gestion_Usuario=debug
logging.level.org.springframework=warn 
logging.level.hibernate.orm.jdbc.bind=debug
logging.level.root=warn

# Formato de salida para la consola y persistencia en archivo físico
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n
logging.file.name=logs/ms-usuario.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7