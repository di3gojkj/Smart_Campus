spring.application.name=MS_Gestion_Usuario
server.port=8084

# Configuración de Base de Datos MySQL
spring.datasource.url=jdbc:mysql://mysql:3306/db_usuario?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuración Avanzada de Logs (SLF4J / Logback)
logging.level.com.diego.MS_Gestion_Usuario=debug
logging.level.org.springframework=warn 
logging.level.hibernate.orm.jdbc.bind=debug
logging.level.root=warn

# Formato de salida para la consola y persistencia en archivo físico
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n
logging.file.name=logs/ms-usuario.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

#OPENAPI / Swagger UI
# Activa la generación del documento JSON con la especificación de tu API
springdoc.api-docs.enabled=true
# Define la ruta de acceso directo para la interfaz gráfica web
springdoc.swagger-ui.path=/swagger-ui.html
# http://localhost:8084/swagger-ui/index.html

ms.estado.url=http://gestion-estado:8083

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=Ms-Gestion-Usuario
eureka.instance.instance-id=${spring.application.name}:${server.port}