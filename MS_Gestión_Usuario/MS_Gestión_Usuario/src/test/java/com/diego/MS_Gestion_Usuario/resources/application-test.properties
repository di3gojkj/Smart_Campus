# Configuración de la URL de conexión a la base de datos en memoria H2.
# Se añade MODE=MySQL para que emule el comportamiento de MySQL, y
# DATABASE_TO_UPPER=false (que reemplaza a DATABASE_TO_LOWER en las versiones nuevas de H2)
# para evitar que H2 convierta todos los nombres de tablas a mayúsculas y cause desajustes.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_UPPER=false;IGNORECASE=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración del Dialecto de Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# "create-drop" le dice a Hibernate que construya toda la estructura de tablas 
# (usuarios, roles, rol_user) basándose estrictamente en las clases @Entity, 
# ignore errores menores de creación, y luego destruya la base de datos al finalizar el test.
spring.jpa.hibernate.ddl-auto=create-drop

# Esta línea apaga una validación interna que suele chocar con H2
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Esto permite que las consultas de Hibernate no fallen si hay ligeras diferencias en el nombrado
spring.jpa.properties.hibernate.globally_quoted_identifiers=true