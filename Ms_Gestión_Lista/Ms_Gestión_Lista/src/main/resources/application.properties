spring.application.name=Ms_Gestion_Lista
server.port=8085

# Configuración de Base de Datos MySQL
spring.datasource.url=jdbc:mysql://mysql:3306/db_academico?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuración Avanzada de Logs para Auditoría
logging.level.com.diego.Ms_Gestion_Lista=debug
logging.level.org.springframework=warn 
logging.level.org.hibernate.orm.jdbc.bind=debug
logging.level.root=warn

# Formato y persistencia física de Logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n
logging.file.name=logs/ms-lista.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html
# http://localhost:8085/swagger-ui/index.html

ms.usuario.url=http://gestion-usuario:8084
ms.curso.url=http://curso-seccion:8098

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=Ms-Gestion-Lista
eureka.instance.instance-id=${spring.application.name}:${server.port}