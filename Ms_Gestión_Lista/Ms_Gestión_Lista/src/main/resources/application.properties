spring.application.name=Ms_Gestion_Lista
server.port=8085

# Configuración de Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_academico?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Direcciones de endpoints externos (Feign)
ms.usuario.url=http://localhost:8084
ms.curso.url=http://localhost:8086

# Configuración Avanzada de Logs para Auditoría
logging.level.com.diego.Ms_Gestion_Lista=debug
logging.level.org.springframework=warn 
logging.level.org.hibernate.orm.jdbc.bind=debug
logging.level.root=warn

# Formato y persistencia física de Logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n
logging.file.name=logs/ms-lista.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7