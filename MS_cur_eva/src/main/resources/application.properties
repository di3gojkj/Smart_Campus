spring.application.name=cur_eva

server.port=8099

# Configuración para la BD
spring.datasource.url=jdbc:mysql://localhost:3306/db_curso_evaluacion
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Propiedades para logs (logback - SLF4J)
logging.level.com.duoc.estado=debug
logging.level.org.springframework=warn 
logging.level.hibernate.orm.jdbc.bind=debug
logging.level.root=warn

# Formato para cada linea de log en la consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

# Configurar guardado de los logs (persistencia de logs)
logging.file.name=logs/Ms_Gestion_Estado.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7