services:

#Servicio 1: levantar MySQL
  mysql:
    #levante una version especifica del mysql
    image: mysql:8.4
    #nombre para este contenedor
    container_name: mysql-microservicios
    #variables de entorno que necesita mysql al iniciar
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: db_productos #solo se crea una, las demás se crean en el sql
    #init-db.sql solo se ejecuta la primera vez
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "3307:3306"
    #verificar que mysql este realmente listo antes de ejecutar lo demás
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","root", "-prootpass"]
      interval: 10s #revisa cada 10 segundos
      timeout: 5s #timeout por cada intento
      retries: 5 #intentos antes de marcar como error
      start_period: 30s #tiempo antes del primer intento
    networks:
      - microservicios-net
  #Servicio 2: Eureka
  eureka-server:
    build:
      context: ./eurekaserver
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    restart: on-failure
    networks:
      - microservicios-net


  #Servicio 
  Ms_Asignatura:
    build:
      context: ./Ms_Asignatura
      dockerfile: Dockerfile
    container_name: Ms_Asignatura
    ports:
      - "8070:8070"
    depends_on:
      mysql:
        condition: service_healthy #espera que mysql este OK
      eureka-server:
        condition: service_started #espera hasta que eureka este levantado
    restart: on-failure
    networks:
      - microservicios-net


