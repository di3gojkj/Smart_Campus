spring.application.name=Ms_Gestion_Estado
server.port=8083

# Configuración para la BD
spring.datasource.url=jdbc:mysql://mysql:3306/db_estado?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Propiedades para logs (logback - SLF4J)
logging.level.com.diego.Ms_Gestion_Estado=debug
logging.level.org.springframework=warn 
logging.level.org.hibernate.orm.jdbc.bind=debug
logging.level.root=warn

# Formato para cada linea de log en la consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

# Configurar guardado de los logs
logging.file.name=logs/ms-estado.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# CONFIGURACIÓN DE SWAGGER UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html
# http://localhost:8083/swagger-ui/index.html

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=Ms-Gestion-Estado
eureka.instance.instance-id=${spring.application.name}:${server.port}