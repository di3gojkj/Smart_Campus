spring.application.name=tipo-asistencia

# Cambio de puerto de ejecución del microservicio
server.port=8091
# Ubicación de la BD a la que nos conectaremos (Asegúrate de tener creada esta BD en tu MySQL)
spring.datasource.url=jdbc:mysql://mysql:3306/db_tipo_asistencia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Usuario y clave para conectarnos a la BD
spring.datasource.username=root
spring.datasource.password=rootpass
# Driver a usar según la BD a conectar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# CORREGIDO PARA SPRING BOOT 4.x / HIBERNATE 7: Se actualiza el dialecto a la plataforma moderna de MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# JPA / HIBERNATE
# Método para la creación automática de las tablas
# update: si no existen las tablas las crea y si existen verifica si hay que hacer alguna modificación
spring.jpa.hibernate.ddl-auto=update
# Propiedades para mostrar las sentencias SQL que se ejecutan en el microservicio internamente
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# EXTRA RECOMENDADO PARA EVITAR ADVERTENCIAS EN CONSOLA:
# Evita los mensajes molestos de escaneo de esquemas antiguos durante el arranque
spring.jpa.properties.hibernate.resource.beans.container=org.springframework.orm.jpa.ConfigurableWithBeanContainer

ms.lista.url=http://gestion-lista:8085

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=Ms-Confi
eureka.instance.instance-id=${spring.application.name}:${server.port}