spring.application.name=ms-tipo-asistencia

server.port=8091
# Ubicación de la BD a la que nos conectaremos (Asegúrate de tener creada esta BD en tu MySQL)
spring.datasource.url=jdbc:mysql://mysql:3306/db_tipo_asistencia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Usuario y clave para conectarnos a la BD
spring.datasource.username=root
spring.datasource.password=rootpass
# Driver a usar según la BD a conectar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.resource.beans.container=org.springframework.orm.jpa.ConfigurableWithBeanContainer

ms.lista.url=http://gestion-lista:8085

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=ms-tipo-asistencia
eureka.instance.instance-id=${spring.application.name}:${server.port}